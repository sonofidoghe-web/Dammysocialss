<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - TemmySocials</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #111827;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Logo area */
    .logo-area {
      padding: 28px 24px 0;
    }

    .logo-placeholder {
      /* Place your TemmySocials logo image here */
      width: 160px;
      height: 48px;
      display: flex;
      align-items: center;
    }

    .logo-placeholder img {
      max-height: 48px;
      width: auto;
      display: block;
    }

    /* Main content */
    .main {
      display: flex;
      justify-content: center;
      padding: 40px 24px 48px;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0a0a0a;
      margin-bottom: 8px;
      letter-spacing: -0.4px;
    }

    .subtitle {
      font-size: 16px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    /* Google button */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 52px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      color: #111827;
      cursor: pointer;
      gap: 10px;
      position: relative;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: background-color 0.15s;
    }

    .google-btn:hover {
      background-color: #f9fafb;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .last-used {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      font-weight: 500;
      color: #4a7c23;
      background-color: #e8f0e0;
      padding: 3px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      gap: 16px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background-color: #e5e7eb;
    }

    .divider-text {
      font-size: 14px;
      color: #6b7280;
      white-space: nowrap;
    }

    /* Form fields */
    .form-group {
      margin-bottom: 20px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    .forgot-link {
      font-size: 14px;
      color: #4a7c23;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 15px;
      color: #111827;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder {
      color: #9ca3af;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: #9ca3af;
    }

    /* Password specific padding for eye */
    input[type="password"],
    input[type="text"].password-visible {
      padding-right: 48px;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* Sign in button */
    .submit-btn {
      width: 100%;
      height: 50px;
      background-color: #4a7c23;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
      transition: background-color 0.15s;
    }

    .submit-btn:hover {
      background-color: #3f6b1e;
    }

    .submit-btn:active {
      background-color: #355a19;
    }

    /* Bottom text */
    .signup-text {
      text-align: center;
      margin-top: 28px;
      font-size: 15px;
      color: #6b7280;
    }

    .signup-text a {
      color: #4a7c23;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (min-width: 480px) {
      .logo-area {
        padding: 36px 24px 0;
      }
      .main {
        padding-top: 48px;
      }
    }
  </style>
</head>
<body>
  <div class="logo-area">
    <div class="logo-placeholder">
      <!-- Place your TemmySocials logo image here -->
      <!-- Example: <img src="your-logo.png" alt="TemmySocials"> -->
    </div>
  </div>

  <main class="main">
    <div class="form-container">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your TemmySocials account</p>

      <button class="google-btn" type="button">
        <!-- Google G logo -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
        <span class="last-used">Last used</span>
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or continue with email</span>
        <div class="divider-line"></div>
      </div>

      <form id="login-form" action="#" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div class="label-row">
            <label for="password">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" value="........" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <!-- Eye icon -->
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn">Sign in</button>
      </form>

      <p class="signup-text">
        No account? <a href="#">Create one free</a>
      </p>
    </div>
  </main>

  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        passwordInput.classList.add('password-visible');
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        passwordInput.classList.remove('password-visible');
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Prevent default (ready for Firebase)
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      // Add your Firebase auth logic here
    });
  </script>
</body>
</html>
