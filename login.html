<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temmysocial - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 440px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 36px 24px;
        }

        /* Header / Logo */
        .header {
            width: 100%;
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-img {
            height: 44px;
            width: auto;
            object-fit: contain;
        }

        /* Welcome Heading */
        .welcome-section {
            margin-bottom: 24px;
        }

        .welcome-title {
            font-size: 28px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .welcome-subtitle {
            font-size: 15px;
            color: #686868;
            font-weight: 400;
        }

        /* Status Feedback Box (Red for error, Green for success) */
        .status-box {
            display: none;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13.5px;
            font-weight: 500;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .status-box.error {
            display: block;
            background-color: #fdf2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .status-box.success {
            display: block;
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        /* Google Sign-in Button */
        .btn-google {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 52px;
            background-color: #ffffff;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            padding: 0 16px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
            margin-bottom: 22px;
        }

        .btn-google:hover {
            background-color: #f9fafb;
        }

        .google-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .google-icon {
            width: 20px;
            height: 20px;
        }

        .google-text {
            font-size: 15px;
            font-weight: 600;
            color: #374151;
        }

        .last-used-badge {
            background-color: #f0fdf4;
            color: #15803d;
            font-size: 11.5px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Spinner for Google Button */
        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2.5px solid #d1d5db;
            border-top: 2.5px solid #4b5563;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        /* Form Inputs */
        .form-group {
            margin-bottom: 18px;
        }

        .form-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .form-label {
            font-size: 14px;
            font-weight: 600;
            color: #111111;
        }

        .forgot-link {
            font-size: 13.5px;
            color: #557c2b;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 14px;
            font-size: 15px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            outline: none;
            color: #1f2937;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #557c2b;
        }

        .form-input::placeholder {
            color: #9ca3af;
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            display: flex;
            align-items: center;
        }

        /* Sign In Button */
        .btn-submit {
            width: 100%;
            height: 48px;
            background-color: #557c2b;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 6px;
            margin-bottom: 24px;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #446322;
        }

        /* Footer Link */
        .auth-footer {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .auth-footer a {
            color: #557c2b;
            text-decoration: none;
            font-weight: 700;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Logo -->
        <header class="header">
            <img src="logo.png" alt="Temmysocial Logo" class="logo-img">
        </header>

        <!-- Welcome Copy -->
        <div class="welcome-section">
            <h1 class="welcome-title">Welcome back</h1>
            <p class="welcome-subtitle">Sign in to your TemmySocials account</p>
        </div>

        <!-- Feedback Message Box (Red for error, Green for success) -->
        <div id="statusBox" class="status-box"></div>

        <!-- Continue with Google Button -->
        <button type="button" id="googleBtn" class="btn-google">
            <div class="google-content">
                <!-- Google SVG Icon -->
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.2v3.15C3.21 21.34 7.27 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.2C.44 8.16 0 9.92 0 11.8s.44 3.64 1.2 5.19l4.07-2.75z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.27 0 3.21 2.66 1.2 6.61l4.07 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                </svg>
                <span id="googleBtnText" class="google-text">Continue with Google</span>
                <div id="googleSpinner" class="spinner"></div>
            </div>
            <span class="last-used-badge">Last used</span>
        </button>

        <div class="divider">or continue with email</div>

        <!-- Sign-In Form -->
        <form id="signInForm">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <div class="input-wrapper" style="margin-top: 6px;">
                    <input type="email" id="email" class="form-input" placeholder="you@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <div class="form-label-row">
                    <label class="form-label" for="password">Password</label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                    <button type="button" id="togglePasswordBtn" class="toggle-password" aria-label="Toggle password visibility">
                        <!-- Eye Icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign in</button>
        </form>

        <div class="auth-footer">
            No account? <a href="#">Create one free</a>
        </div>
    </div>

    <!-- Firebase SDK & Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCbCBQNB2zvaq-zoCNh81EdbE7_PsnKDBI",
            authDomain: "dammysocials-2b126.firebaseapp.com",
            projectId: "dammysocials-2b126",
            storageBucket: "dammysocials-2b126.firebasestorage.app",
            messagingSenderId: "1052998476146",
            appId: "1:1052998476146:web:46ecb610aa1a23f8a0bdeb",
            measurementId: "G-TBFDQZMGXS"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);

        // UI Element References
        const signInForm = document.getElementById('signInForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submitBtn');
        const googleBtn = document.getElementById('googleBtn');
        const googleBtnText = document.getElementById('googleBtnText');
        const googleSpinner = document.getElementById('googleSpinner');
        const statusBox = document.getElementById('statusBox');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');

        // Helper function to display status messages with Red/Green boxes
        function showMessage(message, type) {
            statusBox.textContent = message;
            statusBox.className = `status-box ${type}`;
        }

        // Toggle Password Visibility
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
        });

        // Email & Password Form Submission
        signInForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Change button text to "Signing in..."
            submitBtn.textContent = "Signing in...";
            submitBtn.disabled = true;
            statusBox.style.display = 'none';

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showMessage("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    // Redirect destination after successful sign in
                    window.location.href = "dashboard.html";
                }, 1200);
            } catch (error) {
                // Display error message in red box
                let errorMessage = error.message;
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    errorMessage = "Incorrect email or password. Please try again.";
                }
                showMessage(errorMessage, "error");
                submitBtn.textContent = "Sign in";
                submitBtn.disabled = false;
            }
        });

        // Google Sign-In with Spinner State Transition
        googleBtn.addEventListener('click', async () => {
            // Trigger spinner and adapt text layout matching your second image state
            googleBtnText.style.display = 'none';
            googleSpinner.style.display = 'block';
            statusBox.style.display = 'none';

            const provider = new GoogleAuthProvider();

            try {
                await signInWithPopup(auth, provider);
                showMessage("Google sign-in successful! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 1200);
            } catch (error) {
                // Handle popup closure or errors
                if (error.code !== 'auth/popup-closed-by-user') {
                    showMessage(error.message, "error");
                }
                // Reset Google button state if cancelled or failed
                googleSpinner.style.display = 'none';
                googleBtnText.style.display = 'block';
            }
        });
    </script>
</body>
</html>
