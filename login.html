<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - VerifyStackAcct</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #ffffff;
      color: #1a1a1a;
      min-height: 100vh;
      line-height: 1.5;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      border-bottom: 1px solid #e5e5e5;
      background: #ffffff;
      height: 56px;
    }

    .header-left {
      /* Space reserved for your logo image */
      min-width: 40px;
      height: 28px;
      display: flex;
      align-items: center;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
    }

    .menu-toggle {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      width: 24px;
      height: 24px;
    }

    .menu-toggle span {
      display: block;
      width: 20px;
      height: 2px;
      background-color: #1a1a1a;
      border-radius: 1px;
    }

    /* Main content */
    .main {
      display: flex;
      justify-content: center;
      padding: 48px 24px 40px;
    }

    .form-container {
      width: 100%;
      max-width: 400px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #0a0a0a;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 16px;
      color: #6b6b6b;
      margin-bottom: 32px;
    }

    /* Google button */
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 48px;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      color: #374151;
      cursor: pointer;
      gap: 12px;
      transition: background-color 0.15s;
    }

    .google-btn:hover {
      background-color: #f9fafb;
    }

    .google-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      margin: 28px 0;
      gap: 16px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background-color: #e5e7eb;
    }

    .divider-text {
      font-size: 14px;
      color: #6b7280;
      white-space: nowrap;
    }

    /* Form fields */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="email"],
    input[type="password"],
    input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 15px;
      color: #111827;
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder,
    input[type="text"]::placeholder {
      color: #9ca3af;
    }

    input[type="email"]:focus,
    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: #9ca3af;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9ca3af;
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
    }

    /* Remember / Forgot row */
    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      margin-top: 4px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #374151;
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 18px;
      height: 18px;
      border: 1.5px solid #d1d5db;
      border-radius: 4px;
      appearance: none;
      -webkit-appearance: none;
      background: #fff;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .remember input[type="checkbox"]:checked {
      background-color: #4CAF50;
      border-color: #4CAF50;
    }

    .remember input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .forgot-link {
      font-size: 14px;
      color: #4CAF50;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Sign in button */
    .submit-btn {
      width: 100%;
      height: 48px;
      background-color: #4CAF50;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .submit-btn:hover {
      background-color: #43a047;
    }

    .submit-btn:active {
      background-color: #3d8b40;
    }

    /* Sign up text */
    .signup-text {
      text-align: center;
      margin-top: 28px;
      font-size: 15px;
      color: #4b5563;
    }

    .signup-text a {
      color: #4CAF50;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-text a:hover {
      text-decoration: underline;
    }

    /* Responsive adjustments */
    @media (min-width: 480px) {
      .main {
        padding-top: 64px;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-left">
      <!-- Place your logo image here -->
    </div>
    <div class="header-right">
      <button class="theme-toggle" aria-label="Toggle theme" type="button">
        <!-- Crescent moon icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#4CAF50"/>
        </svg>
      </button>
      <button class="menu-toggle" aria-label="Menu" type="button">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="form-container">
      <h1>Sign in</h1>
      <p class="subtitle">Welcome back to VerifyStackAcct</p>

      <button class="google-btn" type="button">
        <!-- Google G logo -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign in with Google
      </button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or sign in with email</span>
        <div class="divider-line"></div>
      </div>

      <form id="login-form" action="#" method="post">
        <div class="form-group">
          <label for="email">Email</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <!-- Eye icon (open) -->
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div class="options-row">
          <label class="remember">
            <input type="checkbox" name="remember" id="remember">
            Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="submit-btn">Sign in</button>
      </form>

      <p class="signup-text">
        Don't have an account? <a href="#">Sign up</a>
      </p>
    </div>
  </main>

  <script>
    // Password visibility toggle
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    toggleBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      // Simple icon swap (eye / eye-off)
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Prevent default form submit for now (ready for Firebase later)
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      // Hook your Firebase auth here
    });
  </script>
</body>
</html>
