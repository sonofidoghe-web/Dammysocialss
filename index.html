<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temmysocial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .page-wrapper {
            width: 100%;
            max-width: 420px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
        }

        /* Header / Logo Section */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px 8px 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
        }

        .header-icons {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .theme-toggle, .menu-toggle {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2px;
        }

        .theme-toggle {
            color: #1a1a1a;
        }

        .menu-toggle {
            width: 20px;
            height: 14px;
            justify-content: space-between;
        }

        .menu-toggle .bar {
            width: 100%;
            height: 2px;
            background-color: #1a1a1a;
            border-radius: 2px;
        }

        /* Hero Section */
        .hero-section {
            width: 100%;
            padding: 22px 24px 36px 24px;
            text-align: center;
        }

        .hero-title {
            font-size: 33px;
            font-weight: 900;
            line-height: 1.08;
            color: #111111;
            margin-bottom: 22px;
            letter-spacing: -1.2px;
            text-transform: uppercase;
        }

        .hero-title .highlight-green {
            color: #557c2b;
        }

        .hero-description {
            font-size: 14.5px;
            line-height: 1.5;
            color: #686868; /* Exact soft grayish font color matching your screenshot */
            margin-bottom: 34px; /* Pushes buttons further down precisely as shown */
            padding: 0 2px;
            font-weight: 400;
        }

        /* Buttons - Smaller height, compact sizing, and precise spacing */
        .hero-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 42px; /* Reduced smaller height matching the reference image */
            font-size: 12.5px;
            font-weight: 800;
            border-radius: 6px; /* Slightly tighter corner radius matching screenshot */
            text-decoration: none;
            letter-spacing: 0.8px;
        }

        .btn-primary {
            background-color: #557c2b;
            color: #ffffff;
        }

        .btn-primary .arrow {
            margin-left: 8px;
            font-size: 14px;
            line-height: 1;
        }

        .btn-secondary {
            background-color: #ffffff;
            color: #111111;
            border: 1px solid #dcdcdc;
        }
    </style>
</head>
<body>

    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="logo-container">
                <!-- Replace 'logo.png' with your actual logo file name/path -->
                <img src="logo.png" alt="Temmysocial Logo" class="logo-img">
            </div>
            <div class="header-icons">
                <button class="theme-toggle" aria-label="Toggle Theme">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button class="menu-toggle" aria-label="Open Menu">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </header>

        <!-- Hero Section -->
        <main class="hero-section">
            <h1 class="hero-title">
                PREMIUM<br>
                <span class="highlight-green">SOCIAL</span> ASSETS<br>
                DELIVERED<br>
                FAST
            </h1>
            <p class="hero-description">
                Buy aged social media accounts, working tools, virtual SMS numbers, and SME boosting services plus all in one platform, paid from your wallet.
            </p>
            <div class="hero-buttons">
                <a href="#get-started" class="btn btn-primary">
                    GET STARTED 
                    <span class="arrow">&rarr;</span>
                </a>
                <a href="#browse-services" class="btn btn-secondary">
                    BROWSE SERVICES
                </a>
            </div>
        </main>
    </div>

</body>
</html>
